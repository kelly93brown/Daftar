name: Flutter Build APK

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files
        run: flutter create --platforms=android .

      - name: Configure Android Permissions and Desugaring
        shell: python
        run: |
          import os

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()
          
          perms = """<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
          <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
          <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          <uses-permission android:name="android.permission.READ_CONTACTS"/>
          <uses-permission android:name="android.permission.CAMERA"/>
          <application"""
          
          manifest = manifest.replace("<application", perms)
          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(manifest)

          kts_path = "android/app/build.gradle.kts"
          gradle_path = "android/app/build.gradle"
          
          if os.path.exists(kts_path):
              with open(kts_path, "r", encoding="utf-8") as f:
                  build = f.read()
              build = build.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              build += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'
              with open(kts_path, "w", encoding="utf-8") as f:
                  f.write(build)
          elif os.path.exists(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as f:
                  build = f.read()
              build = build.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              build += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n"
              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(build)

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
