name: daftar
description: تطبيق إدارة الحسابات والديون لحرفيي الصاغة والمجوهرات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  printing: ^5.13.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.1
  
  # المكتبات الجديدة للكاميرا وجهات الاتصال
  image_picker: ^11.0.2
  flutter_contacts: ^1.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
