name: daftar
description: تطبيق إدارة الحسابات والديون لحرفيي الصاغة والمجوهرات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # المكتبات الجديدة المضافة للمشاركة والـ PDF والتصوير
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  screenshot: ^2.1.1
  pdf: ^3.10.4
  printing: ^5.11.0
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
